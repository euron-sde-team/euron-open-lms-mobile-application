<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Euron Open LMS Mobile in context</title>
  <desc id="desc">The app has five layers: the app shell (navigation, deep links, session, academy metadata), the features (catalog, learning, assessments, account, auth), the API client (a native transport over the contract vendored from euron-open-lms), the UI kit (design tokens mirrored from the web app) and lib (Keychain or Keystore, preferences, push, safe URLs), plus the loopback server module for offline lectures. It talks to the euron-open-lms API over HTTPS with X-Client native. The API checks access, prices orders, mints playback sessions on euron-video-system and sends push through FCM, which reaches iOS through APNs. The player fetches HLS media only from URLs the LMS minted. On Android, Razorpay runs as a native SDK and Stripe Checkout opens in a Custom Tab and returns through the academy website's app-return page. On iOS the website is only an optional link. Builds ship through the App Store and Google Play.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .acc { fill: #ecfafc; stroke: #0E99AD; stroke-width: 1.6; }
    .zone { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .h { font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .k { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0b7f90; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .ld { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .la { stroke: #0E99AD; stroke-width: 1.8; fill: none; }
    .ah { fill: #64748b; }
    .aa { fill: #0E99AD; }
    .lbl { paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #111a2b; stroke: #2b3a55; }
      .acc { fill: #0d2a33; stroke: #22b8cc; }
      .zone { stroke: #475569; }
      .h, .t, .m { fill: #e2e8f0; }
      .s { fill: #94a3b8; }
      .k { fill: #5fd3e3; }
      .ln, .ld { stroke: #7c8aa5; }
      .ah { fill: #7c8aa5; }
      .la { stroke: #22b8cc; }
      .aa { fill: #22b8cc; }
      .lbl { stroke: #0b1220; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aa" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="1200" height="780" rx="14"/>
  <text class="h" x="40" y="48">Euron Open LMS Mobile in context</text>
  <text class="s" x="40" y="72">The app knows one server: the euron-open-lms API. Video, payments and push are reached through it or with what it hands out.</text>
  <rect class="zone" x="40" y="120" width="440" height="580" rx="12"/>
  <text class="k" x="56" y="142">EURON OPEN LMS MOBILE (iOS AND ANDROID)</text>
  <rect class="box" x="60" y="152" width="400" height="64" rx="10"/>
  <text class="t" x="74" y="180">App shell: src/app</text>
  <text class="s" x="74" y="206">navigation, deep links, session, /api/meta</text>
  <rect class="box" x="60" y="226" width="400" height="64" rx="10"/>
  <text class="t" x="74" y="254">Features: src/features</text>
  <text class="s" x="74" y="280">catalog, learning, assessments, account, auth</text>
  <rect class="acc" x="60" y="300" width="400" height="84" rx="10"/>
  <text class="t" x="74" y="328">API client: src/api</text>
  <text class="s" x="74" y="354">native transport (X-Client: native) over the</text>
  <text class="s" x="74" y="374">contract vendored from euron-open-lms</text>
  <rect class="box" x="60" y="394" width="400" height="64" rx="10"/>
  <text class="t" x="74" y="422">UI kit: src/ui</text>
  <text class="s" x="74" y="448">design tokens mirrored from the web app</text>
  <rect class="box" x="60" y="468" width="400" height="84" rx="10"/>
  <text class="t" x="74" y="496">lib: src/lib</text>
  <text class="s" x="74" y="522">Keychain / Keystore secrets, MMKV prefs,</text>
  <text class="s" x="74" y="542">push registration, safe external URLs</text>
  <rect class="box" x="60" y="562" width="400" height="84" rx="10"/>
  <text class="t" x="74" y="590">Loopback server: modules/loopback-server</text>
  <text class="s" x="74" y="616">127.0.0.1, random port, serves downloaded</text>
  <text class="s" x="74" y="636">lectures and holds their keys in memory</text>
  <rect class="acc" x="560" y="150" width="260" height="400" rx="10"/>
  <text class="t" x="574" y="178">euron-open-lms API</text>
  <text class="s" x="574" y="204">/api over HTTPS</text>
  <text class="s" x="574" y="224">Bearer access token</text>
  <text class="s" x="574" y="244">refresh token in the body</text>
  <text class="s" x="574" y="264"></text>
  <text class="s" x="574" y="284">decides access</text>
  <text class="s" x="574" y="304">prices every order</text>
  <text class="s" x="574" y="324">mints playback sessions</text>
  <text class="s" x="574" y="344">issues download licences</text>
  <text class="s" x="574" y="364">verifies payments</text>
  <text class="s" x="574" y="384">sends push (FCM HTTP v1)</text>
  <text class="s" x="574" y="404">serves /api/meta switches</text>
  <rect class="box" x="560" y="590" width="260" height="104" rx="10"/>
  <text class="t" x="574" y="618">Academy website</text>
  <text class="s" x="574" y="644">/checkout/app-return (Stripe)</text>
  <text class="s" x="574" y="664">iOS: continue on the website</text>
  <text class="s" x="574" y="684">public certificate pages</text>
  <rect class="box" x="920" y="150" width="240" height="104" rx="10"/>
  <text class="t" x="934" y="178">euron-video-system</text>
  <text class="s" x="934" y="204">HLS renditions and keys;</text>
  <text class="s" x="934" y="224">reached only through the</text>
  <text class="s" x="934" y="244">sessions the LMS mints</text>
  <rect class="box" x="920" y="270" width="240" height="84" rx="10"/>
  <text class="t" x="934" y="298">Stripe</text>
  <text class="s" x="934" y="324">server: Checkout Session</text>
  <text class="s" x="934" y="344">app: Custom Tab, Android</text>
  <rect class="box" x="920" y="370" width="240" height="84" rx="10"/>
  <text class="t" x="934" y="398">Razorpay</text>
  <text class="s" x="934" y="424">server: order, verify</text>
  <text class="s" x="934" y="444">app: native SDK, Android</text>
  <rect class="box" x="920" y="470" width="240" height="84" rx="10"/>
  <text class="t" x="934" y="498">FCM / APNs</text>
  <text class="s" x="934" y="524">server: FCM HTTP v1</text>
  <text class="s" x="934" y="544">app: token, banner, taps</text>
  <rect class="box" x="920" y="610" width="240" height="84" rx="10"/>
  <text class="t" x="934" y="638">App Store / Google Play</text>
  <text class="s" x="934" y="664">signed builds, store review</text>
  <path class="ln" d="M480 342 L558 342" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s lbl" x="519" y="334" text-anchor="middle">HTTPS</text>
  <path class="ln" d="M480 642 L558 642" marker-end="url(#a)"/>
  <text class="s lbl" x="519" y="634" text-anchor="middle">browser</text>
  <path class="ln" d="M820 202 L918 202" marker-end="url(#a)"/>
  <text class="s lbl" x="869" y="194" text-anchor="middle">sessions</text>
  <path class="ln" d="M820 312 L918 312" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s lbl" x="869" y="304" text-anchor="middle">orders</text>
  <text class="s lbl" x="869" y="330" text-anchor="middle">webhooks</text>
  <path class="ln" d="M820 412 L918 412" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s lbl" x="869" y="404" text-anchor="middle">orders</text>
  <text class="s lbl" x="869" y="430" text-anchor="middle">verify</text>
  <path class="ln" d="M820 512 L918 512" marker-end="url(#a)"/>
  <text class="s lbl" x="869" y="504" text-anchor="middle">send</text>
  <path class="ld" d="M420 120 L420 104 L1040 104 L1040 148" marker-end="url(#a)"/>
  <text class="s lbl" x="730" y="109" text-anchor="middle">player fetches HLS media from the URLs the LMS minted</text>
  <path class="ln" d="M1040 694 L1040 740 L260 740 L260 702" marker-end="url(#a)"/>
  <text class="s lbl" x="650" y="732" text-anchor="middle">install and update</text>
</svg>
